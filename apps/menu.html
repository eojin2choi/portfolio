<title>오늘 뭐 먹지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 식권 발매기: 한 줄 세로 흐름 — 뽑힌 식권 → 발매 버튼 → 조건 → 먹은 기록 */
:root {
  --bg: #E8EDE9; --panel: #F6F8F6; --line: #CFD8D2; --fg: #16241E; --muted: #5A6E64;
  --paper: #DCEFE0; --paper-line: #9CC5A9; --ink: #1D5A43; --ink-2: #123B2C; --on-ink: #F2FBF5;
  --stamp: #C4372C;
  --f-display: "Do Hyeon", "Black Han Sans", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101614; --panel: #18201D; --line: #2A3631; --fg: #E2EBE5; --muted: #93A79E;
    --paper: #1F3329; --paper-line: #3E6B53; --ink: #5CC59A; --ink-2: #3A9470; --on-ink: #0C1A14;
    --stamp: #FF6F61; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101614; --panel: #18201D; --line: #2A3631; --fg: #E2EBE5; --muted: #93A79E;
  --paper: #1F3329; --paper-line: #3E6B53; --ink: #5CC59A; --ink-2: #3A9470; --on-ink: #0C1A14;
  --stamp: #FF6F61; color-scheme: dark;
}

body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--f-body); }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; display: grid; gap: 20px; }

.top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; }
.top h1 { margin: 0; font: 400 34px/1.1 var(--f-display); letter-spacing: -0.01em; }
.when { margin: 0; font: 500 13px var(--f-mono); color: var(--muted); }

/* 식권 */
.ticket { position: relative; display: grid; grid-template-columns: 68px 1fr; background: var(--paper); border: 1px solid var(--paper-line); border-radius: 6px; min-height: 176px; }
.ticket::before, .ticket::after { content: ""; position: absolute; left: 59px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); border: 1px solid var(--paper-line); }
.ticket::before { top: -10px; clip-path: inset(50% 0 0 0); }
.ticket::after { bottom: -10px; clip-path: inset(0 0 50% 0); }
.stub { border-right: 2px dashed var(--paper-line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding-block: 16px; color: var(--ink); }
.stub-label { font: 500 11px var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; opacity: .75; }
.stub-no { font: 500 17px var(--f-mono); font-variant-numeric: tabular-nums; }
.stub-meal { margin-top: 6px; font: 400 15px var(--f-display); writing-mode: vertical-rl; letter-spacing: 0.2em; }
.tbody { min-width: 0; padding: 18px 20px 18px 22px; display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); }
:root[data-theme="dark"] .tbody { color: var(--fg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tbody { color: var(--fg); } }
.eyebrow { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; color: var(--ink); }
.dish { margin: 0; padding-right: 44px; font: 400 clamp(34px, 9vw, 48px)/1.08 var(--f-display); text-wrap: balance; word-break: keep-all; overflow-wrap: anywhere; }
.ticket.empty .dish { font-size: clamp(24px, 6vw, 30px); }
.tags { margin: 2px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; font-weight: 500; padding: 1px 8px; border: 1px solid var(--paper-line); border-radius: 999px; color: var(--ink); }
.price { margin: auto 0 0; padding-top: 8px; font: 500 13px var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.stamp { position: absolute; top: -12px; right: -6px; width: 66px; height: 66px; border-radius: 50%; border: 3px solid var(--stamp); color: var(--stamp); display: grid; place-items: center; text-align: center; font: 400 14px/1.15 var(--f-display); transform: rotate(-14deg); opacity: .88; background: color-mix(in srgb, var(--paper) 70%, transparent); }
.ticket.empty .stamp { display: none; }
.ticket.stamped .stamp { animation: stamp .32s cubic-bezier(.2,.9,.3,1.3); }
.ticket.rolling .dish { opacity: .55; }
@keyframes stamp { from { transform: rotate(-14deg) scale(1.8); opacity: 0; } to { transform: rotate(-14deg) scale(1); opacity: .88; } }

/* 버튼 */
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { flex: 1 1 auto; font: 500 14px var(--f-body); padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; text-align: center; text-decoration: none; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.btn.primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn:disabled { opacity: .5; cursor: default; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; }

.machine { display: grid; gap: 6px; justify-items: center; padding-top: 4px; }
.pick { width: 100%; font: 400 26px var(--f-display); letter-spacing: 0.04em; padding: 16px; border: 0; border-radius: 14px; background: var(--ink); color: var(--on-ink); cursor: pointer; box-shadow: inset 0 -5px 0 var(--ink-2); transition: transform .08s; }
.pick:active { transform: translateY(2px); box-shadow: inset 0 -3px 0 var(--ink-2); }
.count { margin: 0; font: 500 13px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.count.zero { color: var(--stamp); }

/* 조건·기록 패널 */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 16px; }
.panel h3 { margin: 0; font: 400 20px var(--f-display); }
.row { display: grid; gap: 8px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); }
.label small { font-weight: 400; letter-spacing: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 14px var(--f-body); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--ink); }
.note { margin: 0; font-size: 13px; color: var(--muted); }
.textbtn { font: inherit; font-weight: 700; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.history { list-style: none; margin: 0; padding: 0; display: grid; }
.history li { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 10px; padding-block: 8px; border-top: 1px solid var(--line); }
.history li:first-child { border-top: 0; padding-top: 0; }
.h-name { min-width: 0; font-weight: 500; }
.h-name span { margin-left: 6px; font-size: 12px; font-weight: 400; color: var(--muted); }
.h-when { font: 500 12px var(--f-mono); color: var(--muted); }
.h-when.recent { color: var(--ink); }
.h-del { width: 28px; height: 28px; border-radius: 50%; border: 1px solid transparent; background: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; }
.h-del:hover { border-color: var(--line); color: var(--fg); }

.foot { margin: 0; font-size: 12px; color: var(--muted); text-align: center; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px; background: var(--fg); color: var(--bg); font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  .ticket.stamped .stamp { animation: none; }
  .toast, .pick { transition: none; }
}
</style>

<main class="wrap">
  <header class="top">
    <h1>오늘 뭐 먹지</h1>
    <p class="when" id="when"></p>
  </header>

  <section class="ticket" id="ticket" aria-live="polite" aria-label="뽑힌 식권">
    <div class="stub">
      <span class="stub-label">No.</span>
      <span class="stub-no" id="tno">0001</span>
      <span class="stub-meal" id="tmeal">점심</span>
    </div>
    <div class="tbody">
      <p class="eyebrow" id="tcat">식권</p>
      <h2 class="dish" id="tname">김치찌개</h2>
      <p class="tags" id="ttags"></p>
      <p class="price" id="tprice"></p>
    </div>
    <div class="stamp" aria-hidden="true">오늘의<br>메뉴</div>
  </section>

  <div class="actions" id="actions">
    <button type="button" class="btn primary" id="eat">이걸로 먹을게요</button>
    <button type="button" class="btn" id="another">다른 거</button>
    <a class="btn" id="map" href="https://map.naver.com/" target="_blank" rel="noopener">근처 식당 찾기 ↗</a>
  </div>
  <div class="actions" id="emptyActions" hidden>
    <button type="button" class="btn primary" id="resetAll">조건 모두 풀기</button>
  </div>

  <div class="machine">
    <button type="button" class="pick" id="pick">식권 뽑기</button>
    <p class="count" id="count"></p>
  </div>

  <section class="panel" aria-labelledby="f-h">
    <h3 id="f-h">조건</h3>
    <div class="row"><span class="label">언제</span><div class="chips" id="g-meal"></div></div>
    <div class="row"><span class="label">종류 <small>· 안 고르면 전체</small></span><div class="chips" id="g-cat"></div></div>
    <div class="row"><span class="label">땡기는 것 <small>· 고른 걸 모두 갖춘 메뉴만</small></span><div class="chips" id="g-tag"></div></div>
    <div class="row"><span class="label">예산 <small>· 1인분</small></span><div class="chips" id="g-budget"></div></div>
    <label class="toggle" for="skipRecent"><input type="checkbox" id="skipRecent"> 최근 3일 안에 먹은 메뉴는 빼기</label>
    <p class="note" id="rejected" hidden>오늘 '다른 거'로 넘긴 메뉴 <b id="rejN">0</b>개도 빠져 있어요. <button type="button" class="textbtn" id="rejReset">다시 넣기</button></p>
  </section>

  <section class="panel" aria-labelledby="h-h">
    <h3 id="h-h">먹은 기록</h3>
    <ol class="history" id="history"></ol>
    <p class="note" id="histEmpty">아직 기록이 없어요. 뽑은 메뉴를 '이걸로 먹을게요'로 남기면 3일 동안은 다시 안 나와요.</p>
  </section>

  <p class="foot">메뉴 76가지 · 가격대는 1인분 기준 대략치 · 기록은 이 브라우저에만 저장돼요</p>
</main>
<div class="toast" id="toast" role="status"></div>

const MEALS = [['아', '아침'], ['점', '점심'], ['저', '저녁'], ['야', '야식']];
const CATS = ['한식', '중식', '일식', '양식', '분식', '아시안', '패스트푸드'];
const TAGS = ['국물', '매운', '고기', '면', '든든', '가벼운'];
const BUDGETS = [[1, '1만원까지'], [2, '1.5만원까지'], [3, '상관없음']];
const TIER_LABEL = { 1: '1인 1만원 안팎', 2: '1인 1만~1.5만원', 3: '1인 1.5만원 이상' };
const RECENT_DAYS = 3;

const store = {
  get(k, d) { try { const v = localStorage.getItem('mm.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('mm.' + k, JSON.stringify(v)); } catch {} },
};
const pad = n => String(n).padStart(2, '0');
const ymd = (dt = new Date()) => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
function daysAgo(s) {
  const [y, m, d] = s.split('-').map(Number);
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((t - new Date(y, m - 1, d)) / 86400000);
}
function mealNow() {
  const now = new Date(), h = now.getHours() + now.getMinutes() / 60;
  return h < 4 ? '야' : h < 10.5 ? '아' : h < 15 ? '점' : h < 21 ? '저' : '야';
}
const mealName = code => MEALS.find(m => m[0] === code)[1];

const today = ymd();
const savedRej = store.get('rejected', null);
const state = {
  meal: mealNow(),
  cats: new Set(store.get('cats', [])),
  tags: new Set(),
  budget: store.get('budget', 3),
  skipRecent: store.get('skipRecent', true),
  history: store.get('history', []),
  rejected: new Set(savedRej && savedRej.d === today ? savedRej.list : []),
  current: null,
};

const $ = id => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function recentNames() {
  return new Set(state.history.filter(h => daysAgo(h.d) < RECENT_DAYS).map(h => h.name));
}
function candidates() {
  const recent = state.skipRecent ? recentNames() : new Set();
  return MENUS.filter(m =>
    m.meals.includes(state.meal) &&
    (state.cats.size === 0 || state.cats.has(m.cat)) &&
    [...state.tags].every(t => m.tags.includes(t)) &&
    m.tier <= state.budget &&
    !recent.has(m.name) &&
    !state.rejected.has(m.name));
}

function chipGroup(id, items, isOn, toggle) {
  const el = $(id);
  el.innerHTML = '';
  items.forEach(([val, label], i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.id = `${id}-${i}`;
    b.textContent = label;
    b.setAttribute('aria-pressed', String(isOn(val)));
    b.addEventListener('click', () => { toggle(val); saveFilters(); renderFilters(); });
    el.appendChild(b);
  });
}
function toggleIn(set, v) { set.has(v) ? set.delete(v) : set.add(v); }
function saveFilters() {
  store.set('cats', [...state.cats]);
  store.set('budget', state.budget);
  store.set('skipRecent', state.skipRecent);
  store.set('rejected', { d: today, list: [...state.rejected] });
}

function renderFilters() {
  chipGroup('g-meal', MEALS, v => v === state.meal, v => { state.meal = v; });
  chipGroup('g-cat', CATS.map(c => [c, c]), v => state.cats.has(v), v => toggleIn(state.cats, v));
  chipGroup('g-tag', TAGS.map(t => [t, t]), v => state.tags.has(v), v => toggleIn(state.tags, v));
  chipGroup('g-budget', BUDGETS, v => v === state.budget, v => { state.budget = v; });
  $('skipRecent').checked = state.skipRecent;
  const n = candidates().length;
  $('count').textContent = n ? `${mealName(state.meal)} 후보 ${n}개` : '후보가 없어요 · 조건을 하나 빼 보세요';
  $('count').classList.toggle('zero', n === 0);
  $('rejected').hidden = state.rejected.size === 0;
  $('rejN').textContent = state.rejected.size;
}

function nextTicketNo() {
  const t = store.get('ticket', null);
  const n = t && t.d === today ? t.n + 1 : 1;
  store.set('ticket', { d: today, n });
  return n;
}

function showMenu(m) {
  state.current = m;
  const ticket = $('ticket');
  ticket.classList.remove('empty', 'rolling', 'stamped');
  $('tcat').textContent = `식권 · ${m.cat}`;
  $('tname').textContent = m.name;
  $('ttags').innerHTML = '';
  m.tags.forEach(t => {
    const s = document.createElement('span');
    s.className = 'tag';
    s.textContent = t;
    $('ttags').appendChild(s);
  });
  $('tprice').textContent = TIER_LABEL[m.tier];
  $('map').href = 'https://map.naver.com/p/search/' + encodeURIComponent(m.name);
  $('tmeal').textContent = mealName(state.meal);
  $('actions').hidden = false;
  $('emptyActions').hidden = true;
  void ticket.offsetWidth;
  ticket.classList.add('stamped');
}

function showEmpty() {
  state.current = null;
  $('ticket').classList.remove('rolling', 'stamped');
  $('ticket').classList.add('empty');
  $('tcat').textContent = '식권 · 매진';
  $('tname').textContent = '조건에 맞는 메뉴가 없어요';
  $('ttags').textContent = '';
  $('tprice').textContent = '땡기는 것이나 종류를 하나 빼 보세요.';
  $('actions').hidden = true;
  $('emptyActions').hidden = false;
}

let rolling = false;
function pick(animate = true) {
  if (rolling) return;
  const list = candidates();
  if (!list.length) { showEmpty(); return; }
  const pool = list.length > 1 && state.current ? list.filter(m => m.name !== state.current.name) : list;
  const final = pool[Math.floor(Math.random() * pool.length)];
  $('tno').textContent = String(nextTicketNo()).padStart(4, '0');
  if (!animate || reduceMotion || list.length < 2) { showMenu(final); return; }
  rolling = true;
  $('ticket').classList.add('rolling');
  let i = 0;
  const tick = () => {
    if (i++ < 14) {
      $('tname').textContent = list[Math.floor(Math.random() * list.length)].name;
      setTimeout(tick, 35 + i * 9);
    } else {
      rolling = false;
      showMenu(final);
    }
  };
  tick();
}

function whenLabel(d) {
  const n = daysAgo(d);
  return n === 0 ? '오늘' : n === 1 ? '어제' : `${n}일 전`;
}
function renderHistory() {
  const list = $('history');
  list.innerHTML = '';
  state.history.slice(0, 14).forEach((h, i) => {
    const li = document.createElement('li');
    const name = document.createElement('div');
    name.className = 'h-name';
    name.textContent = h.name;
    const cat = document.createElement('span');
    cat.textContent = h.cat;
    name.appendChild(cat);
    const when = document.createElement('span');
    when.className = 'h-when' + (daysAgo(h.d) < RECENT_DAYS ? ' recent' : '');
    when.textContent = whenLabel(h.d);
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'h-del';
    del.id = `h-del-${i}`;
    del.setAttribute('aria-label', `${h.name} 기록 지우기`);
    del.textContent = '×';
    del.addEventListener('click', () => {
      state.history.splice(i, 1);
      store.set('history', state.history);
      renderHistory();
      renderFilters();
    });
    li.append(name, when, del);
    list.appendChild(li);
  });
  $('histEmpty').hidden = state.history.length > 0;
}

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

$('pick').addEventListener('click', () => pick());
$('another').addEventListener('click', () => {
  if (state.current) state.rejected.add(state.current.name);
  saveFilters();
  renderFilters();
  pick();
});
$('eat').addEventListener('click', () => {
  const m = state.current;
  if (!m) return;
  if (!state.history.some(h => h.name === m.name && h.d === today)) {
    state.history.unshift({ name: m.name, cat: m.cat, d: today });
    state.history = state.history.slice(0, 60);
    store.set('history', state.history);
  }
  renderHistory();
  renderFilters();
  toast(state.skipRecent ? `${m.name} 기록했어요. ${RECENT_DAYS}일 동안은 추천에서 빠져요.` : `${m.name} 기록했어요.`);
});
$('skipRecent').addEventListener('change', e => { state.skipRecent = e.target.checked; saveFilters(); renderFilters(); });
$('rejReset').addEventListener('click', () => { state.rejected.clear(); saveFilters(); renderFilters(); });
$('resetAll').addEventListener('click', () => {
  state.cats.clear(); state.tags.clear(); state.budget = 3; state.rejected.clear();
  saveFilters(); renderFilters(); pick();
});

const days = ['일', '월', '화', '수', '목', '금', '토'];
const now = new Date();
$('when').textContent = `${now.getMonth() + 1}월 ${now.getDate()}일 ${days[now.getDay()]}요일 · ${mealName(state.meal)}`;
renderFilters();
renderHistory();
pick(false);
</script>
